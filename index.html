<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE KARASK</title>

  <!-- Prevent 404 favicon error in dev console -->
  <link rel="icon" href="data:,">

  <!-- Firebase v8 Compatibility SDKs (Realtime Database only, no Auth needed) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Target class for the hand-drawn wiggle effect on structural blocks */
    .wiggle {
      animation: squiggly-anim 0.36s step-end infinite;
      will-change: filter;
    }

    /* Stagger timing & displacement variations so elements don't wiggle in sync */
    .wiggle:nth-child(2n) {
      animation-delay: -0.11s;
      animation-duration: 0.43s;
    }

    .wiggle:nth-child(3n) {
      animation-delay: -0.23s;
      animation-duration: 0.31s;
      animation-name: squiggly-anim-alt;
    }

    .wiggle:nth-child(5n) {
      animation-delay: -0.17s;
      animation-duration: 0.49s;
    }

    /* Keyframe animation toggling organic SVG filter seeds */
    @keyframes squiggly-anim {
      0%   { filter: url('#wiggle-0'); }
      20%  { filter: url('#wiggle-1'); }
      40%  { filter: url('#wiggle-2'); }
      60%  { filter: url('#wiggle-3'); }
      80%  { filter: url('#wiggle-4'); }
    }

    /* Alternate keyframe animation using distinct filter seed sets & sequences */
    @keyframes squiggly-anim-alt {
      0%   { filter: url('#wiggle-alt-2'); }
      20%  { filter: url('#wiggle-alt-0'); }
      40%  { filter: url('#wiggle-alt-4'); }
      60%  { filter: url('#wiggle-alt-1'); }
      80%  { filter: url('#wiggle-alt-3'); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 24px;
    }

    .header-role {
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-energy {
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    button {
      background: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button:hover:not(:disabled) {
      background-color: #ffffff;
      color: #000000;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      background-color: #000000;
      color: #888888;
    }

    input[type="text"], input[type="password"], select {
      background: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      padding: 6px 10px;
      border-bottom: 1px solid #ffffff;
      border-radius: 0;
    }

    select {
      cursor: pointer;
    }

    .fade-section {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
    }

    .fade-section.visible {
      opacity: 1;
      visibility: visible;
    }

    .player-main-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 32px;
      align-items: center;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 60vh;
    }

    @media (max-width: 850px) {
      .player-main-grid {
        grid-template-columns: 1fr;
        gap: 40px;
        text-align: center;
      }
    }

    .column-title {
      font-size: 1.15rem;
      letter-spacing: 3px;
      margin-bottom: 16px;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: 6px;
      font-weight: 800;
    }

    /* Left-aligned Specialties */
    .specialties-container {
      text-align: left;
    }

    ul.specialties-list {
      list-style-type: square;
      padding-left: 20px;
      line-height: 1.8;
      text-align: left;
    }

    ul.specialties-list li {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      word-break: break-word;
    }

    /* Right-aligned Impulses */
    .impulses-container {
      text-align: right;
    }

    ul.impulses-list {
      list-style: none;
      padding-left: 0;
      line-height: 1.8;
      text-align: right;
    }

    ul.impulses-list li {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      word-break: break-word;
    }

    ul.impulses-list li::after {
      content: " •";
      margin-left: 6px;
      font-weight: bold;
    }

    /* Dead Center Controller Box */
    .controller-center-box {
      text-align: center;
      padding: 20px 0;
    }

    .controller-label {
      font-size: 0.95rem;
      letter-spacing: 3px;
      margin-bottom: 12px;
      opacity: 0.85;
      font-weight: bold;
    }

    .controller-name {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.96);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      text-align: center;
      max-width: 460px;
      width: 100%;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.visible .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.35rem;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .role-buttons-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .bid-stepper-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 24px 0;
    }

    .bid-value-display {
      font-size: 2.2rem;
      font-weight: bold;
      min-width: 60px;
      letter-spacing: 2px;
    }

    .d6-display-box {
      font-size: 4.5rem;
      font-weight: bold;
      margin: 20px 0;
      letter-spacing: 4px;
    }

    .gm-container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .gm-control-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
    }

    .gm-voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }

    .gm-voice-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 0;
    }

    .gm-voice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .sub-text {
      font-size: 0.85rem;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .error-msg {
      color: #ff5555;
      font-size: 0.85rem;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

</body>
</html>
